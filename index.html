<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 | 木原優聖</title>
    <style>
        /* 1. 全体の基本設定（レスポンシブ対応） */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
            margin: 0;
            padding: 20px 16px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. カードコンテナ（どの端末でも見やすいサイズ感） */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e1e8ed;
        }

        /* 3. メイン見出し（名前） */
        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e1e8ed;
            font-size: 1.75rem;
            text-align: center;
        }

        /* 4. セクション見出し（大文字・見出し全体に背景色を設定） */
        .section-header {
            background-color: #eef6ff;
            color: #1e6091;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 24px;
            margin-bottom: 12px;
            border-left: 4px solid #3182ce;
            display: flex;
            align-items: center;
        }

        /* 5. 本文やリストの調整 */
        p {
            margin: 8px 0;
            padding: 0 8px;
        }

        ul {
            padding-left: 28px;
            margin: 8px 0;
        }

        li {
            margin-bottom: 8px;
        }

        /* 6. リンクエリア */
        .link-area {
            margin-top: 8px;
            padding: 0 8px;
        }

        a {
            color: #3182ce;
            text-decoration: none;
            font-weight: bold;
            word-break: break-all;
        }

        a:hover {
            text-decoration: underline;
        }

        /* スマホ向けの微調整 */
        @media (max-width: 480px) {
            .card {
                padding: 20px 16px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .section-header {
                font-size: 1.0rem;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 全体を包むメインカード -->
    <div class="card">
        
        <!-- 名前 -->
        <h1>木原　優聖</h1>

        <!-- 自己紹介 -->
        <div class="section-header">💡 自己紹介</div>
        <p>
            こんにちは、木原　優聖です！<br>
            VRCをメインで遊んでる学生です。<br><br>
            ゲームのお誘い大歓迎です！学校でもぜひ話しかけてください😊
        </p>

        <!-- 好きなゲーム -->
        <div class="section-header">🎮 好きなゲーム</div>
        <ul>
            <li>League of Legends</li>
            <li>VRChat</li>
        </ul>

        <!-- 趣味・好きなこと -->
        <div class="section-header">🎨 趣味・好きなこと</div>
        <ul>
            <li>✈️ <strong>旅行:</strong> 友達と一緒に遊びに行くこと</li>
            <li>🎮 <strong>ゲーム:</strong> 友達とワイワイ遊ぶこと</li>
            <li>📚 <strong>漫画:</strong> 異世界系を中心に読むこと</li>
        </ul>

        <!-- リンク -->
        <div class="section-header">🔗 リンク</div>
        <div class="link-area">
            <p>GitHubプロフィール：</p>
            <a href="https://github.com/it008githabu" target="_blank" rel="noopener noreferrer">
                https://github.com/your-username
            </a>
        </div>

    </div>

</body>
</html>
